# The website is its own package, apart from the app: it has its own dependencies and lockfile.
# The same rule as the app's: dependencies may only run install scripts when listed here with true.
# esbuild and sharp ship prebuilt binaries as platform-specific optional dependencies.
allowBuilds:
  esbuild: false
  sharp: false

# Its 2.0 beta, which an optional peer range picks, crashes `astro check` at start.
overrides:
  '@emnapi/runtime': 1.11.3
