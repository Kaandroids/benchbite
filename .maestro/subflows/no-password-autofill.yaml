# Turns off password AutoFill on the simulator, once: its suggestions and its "Save Password?" come
# in sheets of iOS that Maestro cannot see, and they take the keyboard and the screen.
# The setting stays, so run it through `pnpm e2e`, on the tests' own simulator.
appId: com.apple.Preferences
---
- launchApp:
    stopApp: true
# Back to its first page, from the one it was left on
- repeat:
    while:
      visible:
        id: BackButton
    commands:
      - tapOn:
          id: BackButton
- tapOn:
    id: com.apple.settings.general
- scrollUntilVisible:
    element: 'AutoFill & Passwords'
- tapOn: 'AutoFill & Passwords'
- runFlow:
    when:
      visible:
        text: '1'
        childOf:
          id: AutoFillToggle
    commands:
      - tapOn:
          text: '1'
          childOf:
            id: AutoFillToggle
- assertVisible:
    text: '0'
    childOf:
      id: AutoFillToggle
- stopApp
