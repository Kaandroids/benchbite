name: Monitor

# Checks once a day that the scheduled jobs of the hosted Supabase project still work, as a failing
# job only warns in the Postgres logs (ADR 0067). A failed run sends GitHub's usual email. Each
# job gets its own check below.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coach-media-purge:
    name: Photo purge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The monitoring environment holds an access token that can only read this project's database,
    # and the project id, and allows only main (ADR 0132). Unlike production it needs no approval,
    # so the scheduled run can start.
    if: github.ref == 'refs/heads/main'
    environment: monitoring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs coach_media_purge_status() as supabase_read_only_user, which needs no database
      # password, with the script the checks share. The function returns only counts, ages and
      # status codes, and only those are printed.
      - name: Check the photo purge of deleted chats
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          .github/scripts/monitor-status.sh coach_media_purge_status "$RUNNER_TEMP/status.json"
          status=$(cat "$RUNNER_TEMP/status.json")
          jq --raw-output '
            "Queued folders: \(.queued)",
            "Oldest queued folder: \(if .oldest_queued_minutes == null then "none" else "\(.oldest_queued_minutes) minutes" end)",
            "Recent purge responses: \(.responses), failed: \(.failed_responses)",
            "Failed status codes (0 = timeout or network error): \(.failed_statuses | map(tostring) | join(", ") | if . == "" then "none" else . end)",
            "Latest status code: \(.latest_status // "none")"
          ' <<< "$status"

          if [[ "$(jq --raw-output '.healthy' <<< "$status")" != true ]]; then
            echo "::error::The photo purge of deleted chats is failing: it has stopped with folders over an hour old, or its latest call failed"
            exit 1
          fi

  guest-removal:
    name: Guest removal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # As the photo purge's check, with the same read-only token (ADR 0132).
    if: github.ref == 'refs/heads/main'
    environment: monitoring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs inactive_guest_removal_status() as supabase_read_only_user. It returns only a count, an
      # age and the latest run's status, and only those are printed.
      - name: Check the removal of inactive guests
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          .github/scripts/monitor-status.sh inactive_guest_removal_status "$RUNNER_TEMP/status.json"
          status=$(cat "$RUNNER_TEMP/status.json")
          jq --raw-output '
            "Guests overdue by more than a day: \(.overdue_guests)",
            "Latest run: \(.latest_run_status // "none")\(if .latest_run_minutes == null then "" else ", \(.latest_run_minutes) minutes ago" end)"
          ' <<< "$status"

          if [[ "$(jq --raw-output '.healthy' <<< "$status")" != true ]]; then
            echo "::error::The removal of inactive guests is failing: a guest is overdue, or the hourly job has not succeeded in the last two hours"
            exit 1
          fi

  ai-spend:
    name: AI spend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # As the other checks, with the same read-only token (ADR 0132).
    if: github.ref == 'refs/heads/main'
    environment: monitoring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs ai_spend_status() as supabase_read_only_user. The log of a public repository is
      # public, so it says only whether the month's AI spend is past the share it warns at (ADR 0134).
      - name: Check this month's AI spend against the provider's limit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          .github/scripts/monitor-status.sh ai_spend_status "$RUNNER_TEMP/status.json"
          status=$(cat "$RUNNER_TEMP/status.json")

          if [[ "$(jq --raw-output '.paused' <<< "$status")" == true ]]; then
            echo "::error::Bite is paused for everyone: this month's AI spend has reached the limit"
            exit 1
          fi
          if [[ "$(jq --raw-output '.healthy' <<< "$status")" != true ]]; then
            echo "::error::This month's AI spend is past the share of the limit the Monitor warns at"
            exit 1
          fi
          echo "This month's AI spend is below the share of the limit the Monitor warns at"
