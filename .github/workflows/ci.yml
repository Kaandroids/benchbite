name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the run for the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs because tags can be moved to point at different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # The checks are independent, so each one runs even if an earlier check fails,
      # as long as the dependencies were installed.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test --ci

      - name: Locale check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:locales

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          deno-version: v2.x

      # Type-checks, lints and unit-tests the Edge Functions with Deno.
      - name: Edge Functions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm functions:check

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The deploy refuses a migration dated before the newest one it has applied (ADR 0030), so a
      # pull request's new migrations must sort after every migration on the branch it merges into.
      - name: New migrations come last
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          newest=$(git ls-tree --name-only "origin/$BASE_REF" supabase/migrations/ | sort | tail -n 1)
          status=0
          for file in $(git diff --name-only --diff-filter=A "origin/$BASE_REF" HEAD -- supabase/migrations/); do
            if [[ ! "$file" > "$newest" ]]; then
              echo "::error file=$file::Rename it to a timestamp after $(basename "$newest")."
              status=1
            fi
          done
          exit $status

      # Postgres with every migration applied, plus Auth, the API gateway and the Edge Functions
      # runtime for the end-to-end checks. Services nothing here uses are left out.
      - name: Start Supabase
        run: pnpm supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,realtime,postgres-meta,storage-api

      - name: Database tests
        id: tests
        run: pnpm supabase test db

      # Fails when a migration changed the schema but the committed types were not regenerated.
      - name: Generated types are up to date
        if: ${{ !cancelled() }}
        run: |
          pnpm db:types
          git diff --exit-code src/lib/database.types.ts supabase/functions/_shared/database.types.ts

      - name: Generated plans
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: pnpm check:plans
