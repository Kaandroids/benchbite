name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the run for the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs because tags can be moved to point at different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # The checks are independent, so each one runs even if an earlier check fails,
      # as long as the dependencies were installed.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Tests
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test --ci --coverage

      - name: Locale check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:locales

      - name: Rule cases check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:rules

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          deno-version: v2.x

      # Type-checks, lints and unit-tests the Edge Functions with Deno.
      - name: Edge Functions
        id: functions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm functions:check

      # Writes the coverage of the app and of the Edge Functions to the run's summary, and fails
      # when the Edge Functions fall under their thresholds; Jest checks the app's with its tests.
      - name: Coverage
        id: coverage
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.functions.outcome == 'success' }}
        run: pnpm coverage:report

      # Main's coverage is what the README's badges show; the next job publishes it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && github.event_name == 'push' && steps.coverage.outcome == 'success' }}
        with:
          name: coverage-badges
          path: coverage/badges
          if-no-files-found: error
          retention-days: 1

  badges:
    name: Coverage badges
    # Only for main, and only when the Checks job passed, which the coverage comes from.
    if: ${{ github.event_name == 'push' }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One at a time, so that two merges in a row do not push over each other.
    concurrency:
      group: coverage-badges
      cancel-in-progress: false
    # Writes the `badges` branch, which holds only the badges' data; `main` stays protected.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badges
          path: coverage/badges

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-badges.sh coverage/badges

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs because tags can be moved to point at different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: website
        run: pnpm check

      - name: Build
        working-directory: website
        run: pnpm build

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The deploy refuses a migration dated before the newest one it has applied (ADR 0030), so a
      # pull request's new migrations must sort after every migration on the branch it merges into.
      - name: New migrations come last
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          newest=$(git ls-tree --name-only "origin/$BASE_REF" supabase/migrations/ | sort | tail -n 1)
          status=0
          for file in $(git diff --name-only --diff-filter=A "origin/$BASE_REF" HEAD -- supabase/migrations/); do
            if [[ ! "$file" > "$newest" ]]; then
              echo "::error file=$file::Rename it to a timestamp after $(basename "$newest")."
              status=1
            fi
          done
          exit $status

      # Postgres with every migration applied, plus Auth, the API gateway and the Edge Functions
      # runtime for the end-to-end checks. Services nothing here uses are left out.
      - name: Start Supabase
        run: pnpm supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,realtime,postgres-meta,storage-api

      - name: Database tests
        id: tests
        run: pnpm supabase test db

      # Fails when a migration changed the schema but the committed types were not regenerated.
      - name: Generated types are up to date
        if: ${{ !cancelled() }}
        run: |
          pnpm db:types
          git diff --exit-code src/lib/database.types.ts supabase/functions/_shared/database.types.ts

      - name: Generated plans
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: pnpm check:plans
