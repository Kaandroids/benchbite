name: Deploy Supabase

# Deploys the database, its settings and the Edge Functions to the hosted Supabase project
# (ADR 0030). It runs only when started by hand for now; it will follow main once trusted.
on:
  workflow_dispatch:
    inputs:
      upload_images:
        description: Upload the exercise images to storage (the first time, or when they change)
        type: boolean
        default: false

# One deploy at a time, and a started deploy is never cancelled halfway.
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  supabase:
    name: Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only main is deployed. The production environment holds the secrets, allows only main and
    # waits for the maintainer's approval.
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      # Actions are pinned to commit SHAs because tags can be moved to point at different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # The Supabase CLI is a dev dependency, so the deploy uses the version the checks use. The
      # secrets are given only to the steps that deploy, not to the install and its scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link the project
        run: pnpm supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      # Added here and not in the file, so that local email stays in Mailpit (ADR 0091).
      - name: Add the email sender
        run: |
          cat >> supabase/config.toml <<'TOML'

          [auth.email.smtp]
          enabled = true
          host = "smtp.lettermint.co"
          port = 587
          user = "lettermint"
          pass = "env(SMTP_PASSWORD)"
          admin_email = "no-reply@benchbite.com"
          sender_name = "Benchbite"
          TOML

      # Auth and API settings come from supabase/config.toml, such as guest sign-ins and confirming
      # email addresses. Only what the file declares is changed.
      - name: Push the settings
        run: pnpm supabase config push --yes
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      # Applies only the migrations the project does not have yet. A migration dated before the
      # newest one applied is refused, which the checks prevent (ADR 0030). The CLI targets the
      # local stack unless told the linked project with --remote.
      - name: Apply the migrations
        run: pnpm supabase db push --remote --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy the Edge Functions
        run: pnpm supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Upload the exercise images
        if: ${{ inputs.upload_images }}
        run: pnpm supabase seed buckets --remote --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
