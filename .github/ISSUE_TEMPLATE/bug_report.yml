name: Bug report
description: Report something that does not work as expected
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, OS version and app version
      placeholder: iPhone 15, iOS 19.1, app 0.1.0
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Do not include personal data or secrets.
