# pnpm only installs package versions that have been published for a while
# (minimumReleaseAge), which protects against compromised releases.
# Expo publishes SDK packages together and `expo install` pins compatible versions,
# so packages from the Expo organization are exempt from the delay.
minimumReleaseAgeExclude:
  - expo
  - expo-*
  - '@expo/*'
  - babel-preset-expo

# Dependencies may only run install scripts when listed here with true.
# unrs-resolver's postinstall only re-checks its prebuilt native binary,
# which pnpm already installs as a platform-specific optional dependency.
# The same holds for @parcel/watcher, which Jest uses to watch files.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false

# @bacons/apple-targets edits the Xcode project at prebuild through packages that pin old,
# advised versions: @expo/plist parses plists with @xmldom/xmldom 0.7, whose DOMParser 0.8 keeps
# (the rest of Expo's tools use 0.8), and @bacons/xcode lists uuid without requiring it.
overrides:
  '@expo/plist@0.0.18>@xmldom/xmldom': ^0.8.15
  '@bacons/xcode>uuid': ^11.1.1
